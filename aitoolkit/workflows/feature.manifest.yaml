workflow: feature
steps:
  # --- nửa đầu: đặc thù feature mới ---
  - id: 01-requirements
    skill: feature/requirements
    isolate: false
    gate: { type: soft, approver: "PM/Client", prompt: "Duyệt yêu cầu tính năng?" }
  - id: 02-design
    skill: feature/design
    isolate: false
    gate: { type: soft, approver: "Tech Lead", prompt: "Duyệt thiết kế kỹ thuật?" }
  - id: 03-implement
    skill: feature/implement
    isolate: true
    gate: { type: soft, approver: "Developer", prompt: "Hiện thực xong (test xanh), duyệt?" }
  # --- nửa sau: khung dùng chung (shared/*) ---
  - id: 04-ai-review
    skill: shared/ai-review
    isolate: true
    gate: { type: soft, approver: "Reviewer", prompt: "Duyệt review?" }
  - id: 05-verification-testing
    skill: shared/verification-testing
    isolate: true
    gate: { type: soft, approver: "Dev/QA", prompt: "Duyệt kết quả test?" }
  - id: 06-gerrit-automation
    skill: shared/gerrit-automation
    isolate: false
    gate: { type: hard, approver: "Reviewer", prompt: "Xác nhận trước khi upload Gerrit?" }
  - id: 07-ccc-automation
    skill: shared/ccc-automation
    isolate: true
    optional: true
    gate: { type: soft, approver: "PM/QA", prompt: "Duyệt CCC?" }
  - id: 08-release
    skill: shared/release
    isolate: false
    optional: true
    gate: { type: hard, approver: "PM", prompt: "Duyệt release?" }
  - id: 09-knowledge-base
    skill: shared/knowledge-base
    isolate: true
    gate: none
